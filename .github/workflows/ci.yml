name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache-dependency-path: |
            go.sum
            lambdas/go.sum
            e2e/go.sum
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Unit, vet and race gates
        run: |
          mkdir -p .build
          go test -count=1 -race -coverprofile=.build/coverage.out ./...
          go vet ./...
          (cd lambdas && go test -count=1 -race ./... && go vet ./...)
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          args: ./...
      - name: Dependency integrity and vulnerabilities
        run: |
          go mod verify
          (cd lambdas && go mod verify)
          (cd e2e && go mod verify)
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          (cd lambdas && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          (cd e2e && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
      - name: Terraform gates
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
          for env in local aws staging production; do
            terraform -chdir=terraform plan -input=false -lock=false -refresh=false -var-file="environments/${env}.tfvars" -out="/tmp/${env}.tfplan"
          done
      - name: Build and checksum Lambdas
        run: |
          bash automacao/build-lambdas.sh
          (cd .build && sha256sum --check SHA256SUMS)
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .build
          output-file: .build/sbom.spdx.json
          format: spdx-json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify build evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign-blob --yes --bundle .build/SHA256SUMS.bundle .build/SHA256SUMS
          cosign verify-blob \
            --bundle .build/SHA256SUMS.bundle \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            .build/SHA256SUMS
      - name: E2E on isolated LocalStack
        run: |
          bash automacao/subir-ambiente.sh
          (cd e2e && go test -count=1 -v -timeout 30m ./...)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          path: .build/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          directory: terraform
          framework: terraform
