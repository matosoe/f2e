services:
  localstack:
    # A 4.14.0 é a última versão sem token de autenticação e suporta
    # paralelismo das Lambdas usado pela suíte E2E local.
    image: localstack/localstack@sha256:75ba7a4bda54a3020019fba23e99c61bbff7dbf23eea12919e5b75b15c6f03f2
    container_name: localstack-main
    hostname: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,lambda,logs,iam,dynamodb,ssm
      - SQS_ENDPOINT_STRATEGY=path
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_DOCKER_NETWORK=automacao_default
      - F2E_TIMEZONE_OFFSET
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ../.build:/opt/f2e:ro
